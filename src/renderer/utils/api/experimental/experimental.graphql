mutation MarkGroupAsRead($groupId: String!, $collabContextRoutingAri: String) {
  notifications {
    markNotificationsByGroupIdAsRead(
      groupId: $groupId
      collabContextRoutingAri: $collabContextRoutingAri
    )
  }
}

mutation MarkGroupAsUnread(
  $groupId: String!
  $collabContextRoutingAri: String
) {
  notifications {
    markNotificationsByGroupIdAsUnread(
      groupId: $groupId
      collabContextRoutingAri: $collabContextRoutingAri
    )
  }
}

query RetrieveJiraProjectTypes($cloudId: ID!, $keys: [String!]!) {
  jira {
    issuesByKey(cloudId: $cloudId, keys: $keys) {
      key
      summary
      projectField {
        project {
          name
          projectTypeName
          projectType
        }
      }
    }
  }
}
