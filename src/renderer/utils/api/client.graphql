query Me {
  me {
    user {
      accountId
      name
      picture
    }
  }
}

mutation MarkAsRead($notificationIDs: [String!]!) {
  notifications {
    markNotificationsByIdsAsRead(ids: $notificationIDs)
  }
}

mutation MarkAsUnread($notificationIDs: [String!]!) {
  notifications {
    markNotificationsByIdsAsUnread(ids: $notificationIDs)
  }
}

query RetrieveNotificationsByGroupId(
  $groupId: String!
  $first: Int
  $readState: InfluentsNotificationReadState
) {
  notifications {
    notificationGroup(
      groupId: $groupId
      first: $first
      filter: { readStateFilter: $readState }
    ) {
      nodes {
        ...GroupNotificationDetails
      }
    }
  }
}

fragment GroupNotificationDetails on InfluentsNotificationItem {
  notificationId
  readState
}

query MyNotifications(
  $readState: InfluentsNotificationReadState
  $flat: Boolean = true
  $first: Int
) {
  notifications {
    unseenNotificationCount
    notificationFeed(
      flat: $flat
      first: $first
      filter: { readStateFilter: $readState }
    ) {
      pageInfo {
        hasNextPage
      }
      nodes {
        ...AtlassianNotification
      }
    }
  }
}

fragment AtlassianNotification on InfluentsNotificationHeadItem {
  groupId
  groupSize
  additionalActors {
    displayName
    avatarURL
  }
  headNotification {
    ...AtlassianHeadNotification
  }
}

fragment AtlassianHeadNotification on InfluentsNotificationItem {
  notificationId
  timestamp
  readState
  category
  content {
    type
    message
    url
    #FIXME - For some reason, adding this populates content.url and entity.url for Confluence Live Document based notifications.
    bodyItems {
      appearance
      author {
        actorType
        ari
        avatarURL
        displayName
      }
      document {
        data
        format
      }
    }
    entity {
      title
      iconUrl
      url
    }
    path {
      title
      iconUrl
      url
    }
    actor {
      displayName
      avatarURL
    }
  }
  analyticsAttributes {
    key
    value
  }
}

query RetrieveCloudIDsForHostnames($hostNames: [String!]!) {
  tenantContexts(hostNames: $hostNames) {
    cloudId
    hostName
  }
}
