# This is the composite action:
#   https://docs.github.com/en/actions/creating-actions/creating-a-composite-action

name: Setup pnpm, node.js and install dependencies
description: Setup pnpm and node.js with caching

inputs:
  run-install:
    description: 'Whether to run `pnpm install`'
    required: false
    default: 'true'
  directory:
    description: 'Working directory to run `pnpm install` in'
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - name: Setup pnpm and Node.js
      uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
      with:
        node-version-file: ${{ github.workspace }}/.nvmrc
        cache: true
        cache-dependency-path: ${{ inputs.directory }}/pnpm-lock.yaml
        working-directory: ${{ inputs.directory }}
        install: ${{ inputs.run-install }}
        require-lockfile: true
