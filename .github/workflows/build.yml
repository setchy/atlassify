name: Build

on:
  workflow_call:
    secrets:
      APTABASE_KEY:
        required: true
      # Signing certificates
      CSC_LINK:
        required: true
      WIN_CSC_LINK:
        required: true
      CSC_KEY_PASSWORD:
        required: true
      WIN_CSC_KEY_PASSWORD:
        required: true

permissions: {}

jobs:
  build:
    name: Build ${{ matrix.platform }} [electron-builder]
    permissions:
      contents: read
    strategy:
      matrix:
        # electron-builder is invoked through node rather than `pnpm run`: on
        # Windows, `pnpm run` launches the `node_modules/.bin` shim but the
        # target never runs, exiting 0 with no output and no artifacts (#4031).
        include:
          - os: macos-latest
            platform: macOS
            package-cmd: node node_modules/electron-builder/cli.js --mac --publish=never -c.mac.identity=null
            cleanup-path: dist/mac-universal
            verify-path: dist/mac-universal/Atlassify.app
            fuse-path: dist/mac-universal/Atlassify.app
            artifact-name: Atlassify-dist-mac
          - os: windows-latest
            platform: Windows
            package-cmd: node node_modules/electron-builder/cli.js --win --publish=never
            cleanup-path: dist/win-unpacked
            verify-path: dist/win-unpacked
            fuse-path: dist/win-unpacked/Atlassify.exe
            artifact-name: Atlassify-dist-win
          - os: ubuntu-latest
            platform: Linux
            package-cmd: node node_modules/electron-builder/cli.js --linux --publish=never
            cleanup-path: dist/linux-unpacked
            verify-path: dist/linux-unpacked
            fuse-path: dist/linux-unpacked/atlassify
            artifact-name: Atlassify-dist-linux
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Build application
        run: pnpm build
        env:
          VITE_APTABASE_KEY: ${{ secrets.APTABASE_KEY }}

      - name: Package for ${{ matrix.platform }}
        run: ${{ matrix.package-cmd }}
        env:
          # Signing certificates - important to use the correct cert per platform
          CSC_LINK: ${{ matrix.platform == 'macOS' && secrets.CSC_LINK || (matrix.platform == 'windows' && secrets.WIN_CSC_LINK || '') }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'macOS' && secrets.CSC_KEY_PASSWORD || (matrix.platform == 'windows' && secrets.WIN_CSC_KEY_PASSWORD || '') }}

      - name: Verify packaged dependencies
        shell: bash
        run: node scripts/verifyPackagedDependencies.js "${{ matrix.verify-path }}"

      - name: Verify Electron fuses
        run: node scripts/verifyFuses.js "${{ matrix.fuse-path }}"

      - name: Clean up builds
        shell: bash
        run: rm -rfv ${{ matrix.cleanup-path }}

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            dist/*
            !dist/*/
          overwrite: true
