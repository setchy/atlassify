name: Build

on:
  workflow_call:
    secrets:
      APTABASE_KEY:
        required: true
      # Signing certificates
      CSC_LINK:
        required: true
      WIN_CSC_LINK:
        required: true
      CSC_KEY_PASSWORD:
        required: true
      WIN_CSC_KEY_PASSWORD:
        required: true

permissions: {}

jobs:
  build:
    name: Build ${{ matrix.platform }} [electron-builder]
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: macOS
            package-paths:
              - dist/mac-universal/Atlassify.app
              - dist/mac-arm64/Atlassify.app
              - dist/mac/Atlassify.app
            package-cmd: vp run package:macos --publish=never -c.mac.identity=null
            artifact-name: Atlassify-dist-mac
          - os: windows-latest
            platform: Windows
            package-paths:
              - dist/win-unpacked
            package-cmd: vp run package:win --publish=never
            artifact-name: Atlassify-dist-win
          - os: ubuntu-latest
            platform: Linux
            package-paths:
              - dist/linux-unpacked
            package-cmd: vp run package:linux --publish=never
            artifact-name: Atlassify-dist-linux
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          run-install: false
          node-manager: false

      - name: Build application
        run: vp run build
        env:
          VITE_APTABASE_KEY: ${{ secrets.APTABASE_KEY }}

      - name: Package for ${{ matrix.platform }}
        run: ${{ matrix.package-cmd }}
        env:
          # Signing certificates - important to use the correct cert per platform
          CSC_LINK: ${{ matrix.platform == 'macOS' && secrets.CSC_LINK || (matrix.platform == 'windows' && secrets.WIN_CSC_LINK || '') }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'macOS' && secrets.CSC_KEY_PASSWORD || (matrix.platform == 'windows' && secrets.WIN_CSC_KEY_PASSWORD || '') }}

      - name: Verify packaged dependencies
        shell: bash
        run: |
          # One entry per macOS arch, so word splitting is intended.
          # shellcheck disable=SC2086
          node scripts/verifyPackagedDependencies.js ${{ join(matrix.package-paths, ' ') }}

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            dist/*
            !dist/*/
          overwrite: true
          if-no-files-found: error
