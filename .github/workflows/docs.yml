name: Docs

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
      - ".github/actions/setup-node/**"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
      - ".github/actions/setup-node/**"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint Docs
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read
    with:
      directory: "docs"

  check:
    name: Check Docs [Astro]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: $/.github/actions/setup-node
        with:
          directory: "docs"

      - name: Run Astro check
        run: pnpm check
        working-directory: docs

  tests:
    name: Test Docs [node:test]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: $/.github/actions/setup-node
        with:
          directory: "docs"

      - name: Run tests with coverage
        run: pnpm test:coverage
        working-directory: docs

      - name: Archive docs coverage results
        uses: actions/upload-artifact@v7.0.2
        with:
          name: docs-code-coverage-report
          path: docs/coverage/lcov.info
